
name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular project
        run: npm run build -- --configuration production --base-href /hse-inspection/

      - name: Find browser output
        run: |
          if [ -f dist/app/browser/index.html ]; then
            PAGES_DIR="dist/app/browser"
          else
            INDEX_FILE=$(find dist -type f -path '*/browser/index.html' -print -quit)
            if [ -z "$INDEX_FILE" ]; then
              INDEX_FILE=$(find dist -type f -name index.html -not -path '*/server/*' -print -quit)
            fi

            if [ -z "$INDEX_FILE" ]; then
              echo "Browser index.html not found"
              exit 1
            fi

            PAGES_DIR=$(dirname "$INDEX_FILE")
          fi

          echo "Deploying: $PAGES_DIR"
          ls -la "$PAGES_DIR"

          cp "$PAGES_DIR/index.html" "$PAGES_DIR/404.html"
          touch "$PAGES_DIR/.nojekyll"

          echo "PAGES_DIR=$PAGES_DIR" >> "$GITHUB_ENV"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.PAGES_DIR }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
