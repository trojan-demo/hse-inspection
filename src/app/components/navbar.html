<header class="sticky top-0 z-40 bg-white/95 backdrop-blur-sm border-b border-blue-100 shadow-xs no-print">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between gap-6 h-16 sm:h-18">
      <!-- Zone 1: Brand Wordmark -->
      <a
        routerLink="/"
        class="flex items-center gap-2.5 whitespace-nowrap shrink-0 focus-visible:outline-2 focus-visible:outline-blue-600 rounded-lg"
      >
        <img
          src="trojanlogo.png"
          alt="Trojan Construction Holding"
          class="w-9 h-9 object-contain shrink-0"
          referrerpolicy="no-referrer"
        />
        <span class="font-display font-extrabold text-base sm:text-lg tracking-tight text-blue-950">
          MAYSAN DEVELOPMENT PHASE I
        </span>
      </a>

      <!-- Zone 2: Clean Single-Line Nav Links -->
      <nav
        aria-label="Primary navigation"
        class="hidden md:flex items-center gap-7 text-sm font-semibold text-slate-600"
      >
        <a
          routerLink="/"
          routerLinkActive="text-blue-700 border-b-2 border-emerald-600"
          [routerLinkActiveOptions]="{exact: true}"
          class="py-1.5 hover:text-blue-700 transition-colors whitespace-nowrap shrink-0"
        >
          Home
        </a>
        <a
          routerLink="/supervisor-portal"
          routerLinkActive="text-blue-700 border-b-2 border-emerald-600"
          class="py-1.5 hover:text-blue-700 transition-colors whitespace-nowrap shrink-0"
        >
          HSE Inspection
        </a>
      </nav>

      <!-- Zone 3: Single Primary Action -->
      <div class="flex items-center gap-3 shrink-0">
        <a
          routerLink="/supervisor-portal"
          class="hidden sm:inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-semibold transition-colors whitespace-nowrap shrink-0 shadow-xs"
        >
          <mat-icon class="!text-base !w-4 !h-4">assignment_turned_in</mat-icon>
          <span>Daily HSE Form</span>
        </a>

        <button
          type="button"
          (click)="toggleMobileMenu()"
          aria-label="Toggle navigation menu"
          class="md:hidden inline-flex items-center justify-center w-10 h-10 rounded-lg border border-blue-200 bg-blue-50/60 text-blue-900 hover:bg-blue-100 transition-colors cursor-pointer"
        >
          <mat-icon>{{ mobileMenuOpen() ? 'close' : 'menu' }}</mat-icon>
        </button>
      </div>
    </div>
  </div>

  @if (mobileMenuOpen()) {
    <div class="md:hidden border-t border-blue-100 bg-white px-4 py-3 space-y-1.5">
      <a
        routerLink="/"
        (click)="closeMenu()"
        routerLinkActive="bg-blue-50 text-blue-800"
        [routerLinkActiveOptions]="{exact: true}"
        class="flex items-center gap-2 px-3 py-2.5 rounded-lg text-sm font-semibold text-slate-700 hover:bg-blue-50"
      >
        <mat-icon class="!text-lg !w-5 !h-5 text-blue-700">domain</mat-icon>
        <span>Home</span>
      </a>
      <a
        routerLink="/supervisor-portal"
        (click)="closeMenu()"
        routerLinkActive="bg-blue-50 text-blue-800"
        class="flex items-center gap-2 px-3 py-2.5 rounded-lg text-sm font-semibold text-slate-700 hover:bg-blue-50"
      >
        <mat-icon class="!text-lg !w-5 !h-5 text-emerald-600">assignment_turned_in</mat-icon>
        <span>Daily HSE Inspection</span>
      </a>
    </div>
  }
</header>
