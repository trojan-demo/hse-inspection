<div class="space-y-2">
  <div class="flex items-center gap-2">
    <div
      class="flex-1 min-h-10 px-3 py-2 rounded-lg border border-blue-200 bg-blue-50/40 flex items-center justify-between gap-2"
    >
      @if (signatureImage()) {
        <div class="flex items-center gap-2.5 min-w-0">
          <img
            [src]="signatureImage()"
            [alt]="label() + ' handwritten signature'"
            class="h-7 max-w-[140px] object-contain bg-white rounded border border-slate-200 px-1"
          />
          <span class="text-xs font-semibold text-emerald-700 truncate">
            {{ signatureText() || 'Signed' }}
          </span>
        </div>
      } @else {
        <span
          class="text-sm font-semibold italic tracking-wide truncate"
          [class]="signatureText() ? 'text-emerald-700' : 'text-slate-400'"
        >
          {{ signatureText() || placeholder() }}
        </span>
      }

      @if (signatureText() || signatureImage()) {
        <span class="inline-flex items-center gap-1 text-[11px] font-semibold text-emerald-700 shrink-0">
          <mat-icon class="!text-sm !w-3.5 !h-3.5">verified</mat-icon>
          <span>Verified</span>
        </span>
      }
    </div>

    <button
      type="button"
      (click)="toggleDrawMode()"
      class="px-3 py-2 rounded-lg border text-xs font-semibold transition-colors cursor-pointer whitespace-nowrap shrink-0 inline-flex items-center gap-1"
      [class]="
        drawMode()
          ? 'bg-blue-700 text-white border-blue-700'
          : 'bg-white text-blue-800 border-blue-200 hover:bg-blue-50'
      "
    >
      <mat-icon class="!text-sm !w-4 !h-4">draw</mat-icon>
      <span>{{ drawMode() ? 'Done' : 'Sign' }}</span>
    </button>

    @if (signatureImage()) {
      <button
        type="button"
        (click)="clearSignature()"
        title="Clear drawn signature"
        class="p-2 rounded-lg border border-slate-200 bg-white text-slate-500 hover:text-red-600 hover:border-red-200 transition-colors cursor-pointer shrink-0"
      >
        <mat-icon class="!text-sm !w-4 !h-4">delete_outline</mat-icon>
      </button>
    }
  </div>

  @if (drawMode()) {
    <div class="rounded-xl border border-blue-200 bg-white p-3 space-y-2 shadow-xs">
      <div class="flex items-center justify-between text-xs text-slate-600">
        <span class="font-medium">Draw signature for {{ signatureText() || label() }}</span>
        <button
          type="button"
          (click)="clearCanvas()"
          class="text-blue-700 hover:underline font-semibold cursor-pointer"
        >
          Clear Pad
        </button>
      </div>
      <canvas
        #padCanvas
        width="420"
        height="110"
        (pointerdown)="onPointerDown($event)"
        (pointermove)="onPointerMove($event)"
        (pointerup)="onPointerUp()"
        (pointerleave)="onPointerUp()"
        class="w-full h-24 rounded-lg border border-dashed border-blue-300 bg-slate-50 touch-none cursor-crosshair"
      ></canvas>
    </div>
  }
</div>
